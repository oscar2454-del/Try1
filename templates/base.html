<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Estudiantes PRO</title>

<style>
body { font-family: sans-serif; padding: 20px; }
.card {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
}
button { margin-top: 5px; }
</style>
</head>
<body>

<h1>Panel de Estudiantes</h1>

<input type="text" id="buscar" placeholder="Buscar...">

<div id="lista"></div>

<form id="form">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <button>Agregar</button>
</form>

<script>
const API = window.location.origin;

async function cargar() {
    const res = await fetch(`${API}/estudiantes`);
    const data = await res.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    data.forEach(est => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <strong>${est.nombre}</strong><br>
            <small>${est._id}</small><br>

            <button onclick="eliminar('${est._id}')">Eliminar</button>
            <button onclick="editar('${est._id}', '${est.nombre}')">Editar</button>
        `;

        lista.appendChild(div);
    });
}

async function eliminar(id) {
    await fetch(`${API}/eliminar/${id}`, { method: "DELETE" });
    cargar();
}

async function editar(id, nombreViejo) {
    const nuevo = prompt("Nuevo nombre:", nombreViejo);
    if (!nuevo) return;

    await fetch(`${API}/editar/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ nombre: nuevo })
    });

    cargar();
}

document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nombre = document.getElementById("nombre").value;

    await fetch(`${API}/agregar`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ nombre })
    });

    document.getElementById("nombre").value = "";
    cargar();
});

//Buscar
document.getElementById("buscar").addEventListener("input", () => {
    const texto = document.getElementById("buscar").value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(texto)
            ? "block"
            : "none";
    });
});

cargar();
</script>

</body>
</html>
