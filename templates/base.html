<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Lista</title>
    <style>
        :root { --p: #2ecc71; --t: #f1c40f; --a: #e74c3c; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .app { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h1 { margin: 0; color: var(--dark); font-size: 1.5rem; }
        .btn-excel { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .search { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        .alumno { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f9f9f9; }
        .alumno:hover { background: #fcfcfc; }
        .nombre { font-weight: 600; color: #333; }
        .eliminar { color: #ccc; border: none; background: none; cursor: pointer; font-size: 0.75rem; }
        .eliminar:hover { color: var(--a); }

        .botones { display: flex; gap: 8px; }
        .btn-check { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #eee; background: white; font-weight: bold; cursor: pointer; color: #999; transition: 0.2s; }
        
        .active-p { background: var(--p) !important; color: white; border-color: var(--p); }
        .active-t { background: var(--t) !important; color: white; border-color: var(--t); }
        .active-a { background: var(--a) !important; color: white; border-color: var(--a); }

        #form-nuevo { display: flex; gap: 10px; margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; }
        #form-nuevo input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        #form-nuevo button { background: var(--dark); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div>
            <h1>Control de Asistencia</h1>
            <small id="fecha-hoy" style="color: #888;"></small>
        </div>
        <button class="btn-excel" onclick="descargarExcel()">📊 Excel</button>
    </div>

    <input type="text" id="buscar" class="search" placeholder="Buscar alumno por nombre...">

    <div id="lista-estudiantes"></div>

    <form id="form-nuevo">
        <input type="text" id="input-nombre" placeholder="Nuevo estudiante..." required>
        <button type="submit">Agregar</button>
    </form>
</div>

<script>
    const API = window.location.origin;
    document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

    async function cargar() {
        const res = await fetch(`${API}/estudiantes`);
        const data = await res.json();
        const lista = document.getElementById("lista-estudiantes");
        lista.innerHTML = "";

        data.forEach(est => {
            const div = document.createElement("div");
            div.className = "alumno";
            div.innerHTML = `
                <div>
                    <div class="nombre">${est.nombre}</div>
                    <button class="eliminar" onclick="eliminar('${est._id}')">Eliminar</button>
                </div>
                <div class="botones">
                    <button class="btn-check" onclick="marcar('${est._id}', 'presente', this)">P</button>
                    <button class="btn-check" onclick="marcar('${est._id}', 'tarde', this)">T</button>
                    <button class="btn-check" onclick="marcar('${est._id}', 'ausente', this)">A</button>
                </div>
            `;
            lista.appendChild(div);
        });
    }

    async function marcar(id, estado, btn) {
        const row = btn.parentElement.querySelectorAll('.btn-check');
        row.forEach(b => b.classList.remove('active-p', 'active-t', 'active-a'));
        btn.classList.add('active-' + estado.charAt(0));

        await fetch(`${API}/asistencia`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ estudiante_id: id, estado: estado })
        });
    }

    async function eliminar(id) {
        if (!confirm("¿Borrar este estudiante y su historial?")) return;
        await fetch(`${API}/eliminar/${id}`, { method: "DELETE" });
        cargar();
    }

    function descargarExcel() {
        window.location.href = `${API}/exportar-excel`;
    }

    document.getElementById("form-nuevo").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nombre = document.getElementById("input-nombre").value;
        await fetch(`${API}/agregar`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ nombre })
        });
        document.getElementById("input-nombre").value = "";
        cargar();
    });

    document.getElementById("buscar").addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll(".alumno").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? "flex" : "none";
        });
    });

    cargar();
</script>
</body>
</html>
